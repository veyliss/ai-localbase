services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: ai-localbase-qdrant-dev
    restart: unless-stopped
    ports:
      - "${QDRANT_BIND_ADDRESS:-127.0.0.1}:${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_BIND_ADDRESS:-127.0.0.1}:${QDRANT_GRPC_PORT:-6334}:6334"
    environment:
      AI_LOCALBASE_QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      AI_LOCALBASE_QDRANT_BIND_ADDRESS: ${QDRANT_BIND_ADDRESS:-127.0.0.1}
    entrypoint:
      - /bin/sh
      - -c
      - |
        case "$$AI_LOCALBASE_QDRANT_BIND_ADDRESS" in
          127.0.0.1|::1|localhost) ;;
          *)
            if [ -z "$$AI_LOCALBASE_QDRANT_API_KEY" ]; then
              echo "QDRANT_API_KEY must be set when QDRANT_BIND_ADDRESS is not loopback" >&2
              exit 1
            fi
            ;;
        esac
        if [ -n "$$AI_LOCALBASE_QDRANT_API_KEY" ]; then
          export QDRANT__SERVICE__API_KEY="$$AI_LOCALBASE_QDRANT_API_KEY"
        fi
        exec ./entrypoint.sh
    volumes:
      - ${QDRANT_STORAGE_PATH:-./qdrant_storage}:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333; printf \"GET /collections HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q \" 200 \"'"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.dev.Dockerfile
    container_name: ai-localbase-backend-dev
    restart: unless-stopped
    working_dir: /app
    depends_on:
      qdrant:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: ${PORT:-8080}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/data/uploads}
      INDEXED_CONTENT_DIR: ${INDEXED_CONTENT_DIR:-/app/data/indexed-content}
      STAGING_DIR: ${STAGING_DIR:-/app/data/staging}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
      MAX_JSON_BODY_BYTES: ${MAX_JSON_BODY_BYTES:-4194304}
      STATE_FILE: ${STATE_FILE:-/app/data/app-state.json}
      CHAT_HISTORY_FILE: ${CHAT_HISTORY_FILE:-/app/data/chat-history.db}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION_PREFIX: ${QDRANT_COLLECTION_PREFIX:-kb_}
      QDRANT_VECTOR_SIZE: ${QDRANT_VECTOR_SIZE:-768}
      QDRANT_DISTANCE: ${QDRANT_DISTANCE:-Cosine}
      QDRANT_TIMEOUT_SECONDS: ${QDRANT_TIMEOUT_SECONDS:-5}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      ENABLE_AUTH: ${ENABLE_AUTH:-false}
      AUTH_USERNAME: ${AUTH_USERNAME:-root}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      AUTH_SETUP_TOKEN: ${AUTH_SETUP_TOKEN:-}
      AUTH_RESET_TOKEN: ${AUTH_RESET_TOKEN:-}
      AUTH_RESET_PASSWORD: ${AUTH_RESET_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
      ENABLE_HYBRID_SEARCH: ${ENABLE_HYBRID_SEARCH:-false}
      ENABLE_SEMANTIC_RERANKER: ${ENABLE_SEMANTIC_RERANKER:-false}
      ENABLE_QUERY_REWRITE: ${ENABLE_QUERY_REWRITE:-false}
      ENABLE_SEMANTIC_CACHE: ${ENABLE_SEMANTIC_CACHE:-false}
      ENABLE_CONTEXT_COMPRESSION: ${ENABLE_CONTEXT_COMPRESSION:-false}
      RETRIEVAL_TOPK_DOCUMENT: ${RETRIEVAL_TOPK_DOCUMENT:-6}
      RETRIEVAL_CANDIDATE_TOPK_DOCUMENT: ${RETRIEVAL_CANDIDATE_TOPK_DOCUMENT:-12}
      RETRIEVAL_TOPK_KNOWLEDGE_BASE: ${RETRIEVAL_TOPK_KNOWLEDGE_BASE:-10}
      RETRIEVAL_CANDIDATE_TOPK_ALL_DOCS: ${RETRIEVAL_CANDIDATE_TOPK_ALL_DOCS:-32}
      RETRIEVAL_MAX_CHUNKS_PER_DOCUMENT: ${RETRIEVAL_MAX_CHUNKS_PER_DOCUMENT:-2}
      RETRIEVAL_MAX_CONTEXT_CHARS: ${RETRIEVAL_MAX_CONTEXT_CHARS:-2400}
      RETRIEVAL_ENABLE_AUTO_EXPAND: ${RETRIEVAL_ENABLE_AUTO_EXPAND:-false}
      ENABLE_MCP: ${ENABLE_MCP:-false}
      ENABLE_MCP_LEGACY_TOKEN: ${ENABLE_MCP_LEGACY_TOKEN:-false}
      MCP_BASE_PATH: ${MCP_BASE_PATH:-/mcp}
      MCP_REQUEST_TIMEOUT_SECONDS: ${MCP_REQUEST_TIMEOUT_SECONDS:-15}
      MCP_REQUESTS_PER_MINUTE: ${MCP_REQUESTS_PER_MINUTE:-120}
      GO111MODULE: "on"
    command: sh -c "go run ."
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:${PORT:-8080}"
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${PORT:-8080}/readyz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12

  frontend:
    image: node:20.19-alpine
    container_name: ai-localbase-frontend-dev
    restart: unless-stopped
    working_dir: /app
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
      VITE_DEV_PROXY_TARGET: ${VITE_DEV_PROXY_TARGET:-http://backend:8080}
      VITE_APP_VERSION: ${VITE_APP_VERSION:-}
      CHOKIDAR_USEPOLLING: "true"
    command: sh -c "npm ci && until wget -qO- http://backend:${PORT:-8080}/readyz >/dev/null 2>&1; do echo 'waiting for backend readiness...'; sleep 2; done && npm run dev -- --host 0.0.0.0 --port 4173"
    ports:
      - "${FRONTEND_PORT:-4173}:4173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
